<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Park Owner Portal — RVPark Success</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/tokens.css">
<link rel="stylesheet" href="/src/css/components.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--sp-4); }
  .login-card { width: 100%; max-width: 420px; padding: var(--sp-6) var(--sp-5); border-radius: var(--radius-lg); text-align: center; }
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="login-card glass-strong" data-reveal>
  <a href="index.html" class="nav-brand" style="justify-content:center; margin-bottom: var(--sp-4);"><span class="mark mark-logo"><img src="/images/logo/rvparksuccess-icon.png" alt="RVPark Success logo"></span></a>
  <p class="eyebrow">Park Owner Portal</p>
  <h1>Manage Your Park</h1>
  <p class="lede">Log in or create an account to manage your RV park sites and bookings.</p>

  <div class="auth-tabs">
    <button type="button" class="auth-tab is-active" data-tab="login">Log In</button>
    <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
  </div>

  <form id="loginForm" class="auth-panel is-active" data-panel="login">
    <div class="field-float"><input id="loginEmail" name="email" type="email" required autocomplete="email"><label for="loginEmail">Email</label></div>
    <div class="field-float"><input id="loginPassword" name="password" type="password" required autocomplete="current-password"><label for="loginPassword">Password</label></div>
    <button type="submit" class="btn btn-primary magnetic" style="width:100%; justify-content:center;"><span>Log In</span></button>
  </form>

  <form id="signupForm" class="auth-panel" data-panel="signup">
    <div class="field-float"><input id="suParkName" name="parkName" required><label for="suParkName">Park Name</label></div>
    <div class="field-float"><input id="suLocation" name="location" required><label for="suLocation">Location</label></div>
    <div class="field-float"><input id="suOwnerName" name="ownerName" required><label for="suOwnerName">Owner Name</label></div>
    <div class="field-float"><input id="suEmail" name="email" type="email" required autocomplete="email"><label for="suEmail">Email</label></div>
    <div class="field-float"><input id="suPhone" name="phone" type="tel" required autocomplete="tel"><label for="suPhone">Phone</label></div>
    <div class="field-float"><input id="suPassword" name="password" type="password" required autocomplete="new-password" minlength="8"><label for="suPassword">Password (min. 8 characters)</label></div>
    <button type="submit" class="btn btn-primary magnetic" style="width:100%; justify-content:center;"><span>Create Account</span></button>
  </form>

  <div class="login-error" id="loginError"></div>
</div>

<script type="module" src="/src/js/park-owner-login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — RVPark Success</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/tokens.css">
<link rel="stylesheet" href="/src/css/components.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--sp-4); padding-top: calc(var(--sp-4) + 86px); }
  .login-container { width: 100%; max-width: 500px; }
  .login-header { text-align: center; margin-bottom: var(--sp-6); }
  .login-header .nav-brand { justify-content: center; margin-bottom: var(--sp-4); display: flex; }
  .login-header h1 { font-size: 1.75rem; margin-bottom: var(--sp-2); }
  .login-header p { color: var(--cream-dim); }

  .role-tabs { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); }
  .role-tab { flex: 1; padding: var(--sp-3); text-align: center; border-radius: var(--radius-md); background: var(--surface-glass); border: 1px solid var(--border-glass); cursor: pointer; font-weight: 600; color: var(--cream-dim); transition: all 0.2s ease; }
  .role-tab.is-active { background: var(--amber); color: var(--black); border-color: var(--amber); }

  .login-card { padding: var(--sp-6) var(--sp-5); border-radius: var(--radius-lg); }
  .auth-form { display: none; }
  .auth-form.is-active { display: block; }
  .auth-tabs { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); border-radius: var(--radius-md); background: rgba(255,255,255,0.04); padding: 4px; }
  .auth-tab { flex: 1; padding: var(--sp-2) 0; border: none; background: none; border-radius: calc(var(--radius-md) - 4px); font-family: inherit; font-weight: 600; font-size: 0.875rem; color: var(--cream-dim); cursor: pointer; transition: background 0.2s, color 0.2s; }
  .auth-tab.is-active { background: var(--amber); color: var(--black); }
  .auth-panel { display: none; }
  .auth-panel.is-active { display: block; }
  .auth-panel { margin-top: var(--sp-4); }

  .login-error { display: none; margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); background: rgba(217,60,46,0.1); border: 1px solid rgba(217,60,46,0.4); color: #f0a89a; font-size: 0.875rem; }
  .login-error.is-visible { display: block; }

  .field-float { position: relative; margin-bottom: var(--sp-4); }
  .field-float input, .field-float select { width: 100%; padding: var(--sp-3); border-radius: var(--radius-md); background: var(--surface-glass); border: 1px solid var(--border-glass); color: var(--cream); font-family: inherit; font-size: 1rem; transition: border-color 0.2s; }
  .field-float input:focus, .field-float select:focus { outline: none; border-color: var(--amber); }
  .field-float label { position: absolute; top: var(--sp-3); left: var(--sp-3); font-size: 0.875rem; color: var(--cream-dim); pointer-events: none; transition: all 0.2s; }
  .field-float input:focus ~ label, .field-float input:not(:placeholder-shown) ~ label { top: -var(--sp-2); left: var(--sp-3); font-size: 0.75rem; color: var(--amber); background: var(--black); padding: 0 4px; }

  .submit-btn { width: 100%; padding: var(--sp-3); margin-top: var(--sp-2); border-radius: var(--radius-pill); background: var(--amber); color: var(--black); border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .submit-btn:hover { background: var(--amber-light); }
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="login-container">
  <div class="login-header">
    <a href="#" class="nav-brand"><span class="mark mark-logo"><img src="/images/logo/rvparksuccess-icon.png" alt="RVPark Success logo"></span></a>
    <h1>Welcome</h1>
    <p>Choose your role to get started</p>
  </div>

  <div class="role-tabs">
    <button type="button" class="role-tab is-active" data-role="customer">Customer</button>
    <button type="button" class="role-tab" data-role="owner">RVPark Owner</button>
  </div>

  <!-- CUSTOMER FORM -->
  <div class="auth-form is-active" id="customerForm" data-role="customer">
    <div class="login-card glass-strong">
      <div class="auth-tabs">
        <button type="button" class="auth-tab is-active" data-tab="customer-login">Log In</button>
        <button type="button" class="auth-tab" data-tab="customer-signup">Sign Up</button>
      </div>

      <!-- Customer Login Panel -->
      <form class="auth-panel is-active" id="customerLoginForm" data-panel="customer-login">
        <div class="field-float">
          <input id="custLoginEmail" type="email" placeholder=" " required>
          <label for="custLoginEmail">Email</label>
        </div>
        <div class="field-float">
          <input id="custLoginPassword" type="password" placeholder=" " required>
          <label for="custLoginPassword">Password</label>
        </div>
        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <!-- Customer Signup Panel -->
      <form class="auth-panel" id="customerSignupForm" data-panel="customer-signup">
        <div class="field-float">
          <input id="custSignupName" type="text" placeholder=" " required>
          <label for="custSignupName">Full Name</label>
        </div>
        <div class="field-float">
          <input id="custSignupEmail" type="email" placeholder=" " required>
          <label for="custSignupEmail">Email</label>
        </div>
        <div class="field-float">
          <input id="custSignupPhone" type="tel" placeholder=" ">
          <label for="custSignupPhone">Phone (optional)</label>
        </div>
        <div class="field-float">
          <input id="custSignupPassword" type="password" placeholder=" " minlength="8" required>
          <label for="custSignupPassword">Password (min. 8 characters)</label>
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <div class="login-error" id="custError"></div>
    </div>
  </div>

  <!-- OWNER FORM -->
  <div class="auth-form" id="ownerForm" data-role="owner">
    <div class="login-card glass-strong">
      <div class="auth-tabs">
        <button type="button" class="auth-tab is-active" data-tab="owner-login">Log In</button>
        <button type="button" class="auth-tab" data-tab="owner-signup">Sign Up</button>
      </div>

      <!-- Owner Login Panel -->
      <form class="auth-panel is-active" id="ownerLoginForm" data-panel="owner-login">
        <div class="field-float">
          <input id="ownerLoginEmail" type="email" placeholder=" " required>
          <label for="ownerLoginEmail">Email</label>
        </div>
        <div class="field-float">
          <input id="ownerLoginPassword" type="password" placeholder=" " required>
          <label for="ownerLoginPassword">Password</label>
        </div>
        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <!-- Owner Signup Panel -->
      <form class="auth-panel" id="ownerSignupForm" data-panel="owner-signup">
        <div class="field-float">
          <input id="ownerSignupParkName" type="text" placeholder=" " required>
          <label for="ownerSignupParkName">Park Name</label>
        </div>
        <div class="field-float">
          <input id="ownerSignupLocation" type="text" placeholder=" " required>
          <label for="ownerSignupLocation">Location (City, State)</label>
        </div>
        <div class="field-float">
          <input id="ownerSignupOwnerName" type="text" placeholder=" " required>
          <label for="ownerSignupOwnerName">Owner Full Name</label>
        </div>
        <div class="field-float">
          <input id="ownerSignupEmail" type="email" placeholder=" " required>
          <label for="ownerSignupEmail">Email</label>
        </div>
        <div class="field-float">
          <input id="ownerSignupPhone" type="tel" placeholder=" " required>
          <label for="ownerSignupPhone">Phone</label>
        </div>
        <div class="field-float">
          <input id="ownerSignupPassword" type="password" placeholder=" " minlength="8" required>
          <label for="ownerSignupPassword">Password (min. 8 characters)</label>
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <div class="login-error" id="ownerError"></div>
    </div>
  </div>
</div>

<script type="module" src="/src/js/login.js"></script>
</body>
</html>

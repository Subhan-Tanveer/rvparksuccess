<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Platform Admin — RVPark Success</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/tokens.css">
<link rel="stylesheet" href="/src/css/components.css">
<style>
  .admin-topbar { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-glass); }
  .admin-wrap { max-width: 1100px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); }
  .admin-section { padding: var(--sp-5) var(--sp-4); border-radius: var(--radius-lg); margin-bottom: var(--sp-5); }
  .admin-table { width: 100%; border-collapse: collapse; margin-top: var(--sp-3); }
  .admin-table th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--cream-dim); padding: 8px 10px; border-bottom: 1px solid var(--border-glass); }
  .admin-table td { padding: 10px; border-bottom: 1px solid var(--border-glass); font-size: 0.9375rem; }
  .admin-table code { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--amber-light); }
  .admin-empty { text-align: center; padding: var(--sp-4); color: var(--cream-dim); font-size: 0.9375rem; }
  .admin-alert { padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); font-size: 0.875rem; margin-top: var(--sp-3); display: none; }
  .admin-alert.is-visible { display: block; }
  .admin-alert.is-success { background: rgba(46,155,84,0.12); border: 1px solid var(--border-amber); color: var(--amber-light); }
  .admin-alert.is-error { background: rgba(217,60,46,0.1); border: 1px solid rgba(217,60,46,0.4); color: #f0a89a; }
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="admin-topbar">
  <a href="index.html" class="nav-brand"><span class="mark mark-logo"><img src="/images/logo/rvparksuccess-icon.png" alt="RVPark Success logo"></span><span class="name">RVPark Success — Platform Admin</span></a>
  <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
</div>

<div class="admin-wrap" id="gate" style="display:none;">
  <div class="admin-section glass" data-reveal>
    <div class="section-head" style="margin-bottom: var(--sp-3);">
      <p class="eyebrow">New Park</p>
      <h2 style="font-size: 1.375rem;">Create a Client Park</h2>
    </div>
    <form id="createParkForm">
      <div class="field-row-2">
        <div class="field-float"><input id="pName" name="name" required><label for="pName">Park Name</label></div>
        <div class="field-float"><input id="pLocation" name="location" required><label for="pLocation">Location (City, State)</label></div>
      </div>
      <div class="field-row-2">
        <div class="field-float"><input id="pUsername" name="staffUsername" required><label for="pUsername">Staff Login Username</label></div>
        <div class="field-float"><input id="pPassword" name="staffPassword" type="text" required minlength="8"><label for="pPassword">Staff Login Password</label></div>
      </div>
      <button type="submit" class="btn btn-primary magnetic" id="createParkBtn"><span>Create Park</span></button>
      <p class="form-note">You set this login and give it to the park's staff — this is separate from your own admin password.</p>
      <div class="admin-alert" id="createParkAlert"></div>
    </form>
  </div>

  <div class="admin-section glass" data-reveal>
    <div class="section-head" style="margin-bottom: 0;">
      <p class="eyebrow">All Parks</p>
      <h2 style="font-size: 1.375rem;">Client Parks</h2>
    </div>
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Location</th><th>Staff Login</th><th>Sites</th><th>Created</th></tr></thead>
      <tbody id="parksTableBody"></tbody>
    </table>
    <div class="admin-empty" id="parksEmpty" style="display:none;">No parks yet — create your first one above.</div>
  </div>
</div>

<script type="module" src="/src/js/admin-dashboard.js"></script>
</body>
</html>

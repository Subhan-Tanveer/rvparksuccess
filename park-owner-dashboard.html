<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Park Owner Dashboard — RVPark Success</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/tokens.css">
<link rel="stylesheet" href="/src/css/components.css">
<style>
  .admin-wrap { max-width: 1100px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); }
  .admin-topbar { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-glass); flex-wrap: wrap; gap: var(--sp-2); }
  .admin-section { padding: var(--sp-5) var(--sp-4); border-radius: var(--radius-lg); margin-bottom: var(--sp-5); }
  .admin-table { width: 100%; border-collapse: collapse; margin-top: var(--sp-3); }
  .admin-table th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--cream-dim); padding: 8px 10px; border-bottom: 1px solid var(--border-glass); }
  .admin-table td { padding: 10px; border-bottom: 1px solid var(--border-glass); font-size: 0.9375rem; }
  .admin-empty { text-align: center; padding: var(--sp-4); color: var(--cream-dim); font-size: 0.9375rem; }
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="admin-topbar">
  <a href="index.html" class="nav-brand"><span class="mark mark-logo"><img src="/images/logo/rvparksuccess-icon.png" alt="RVPark Success logo"></span><span class="name" id="parkNameHeading">Park Owner Dashboard</span></a>
  <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
</div>

<div class="admin-wrap" id="gate" style="display:none;">

  <!-- Park Info Section -->
  <div class="admin-section glass" data-reveal>
    <div class="section-head" style="margin-bottom: var(--sp-3);">
      <p class="eyebrow">Park Details</p>
      <h2 style="font-size: 1.375rem;" id="parkNameDisplay">Your Park</h2>
    </div>
    <p id="parkLocationDisplay" style="color: var(--cream-dim); margin-bottom: var(--sp-4);"></p>
  </div>

  <!-- Add RV Sites Section -->
  <div class="admin-section glass" data-reveal>
    <div class="section-head" style="margin-bottom: var(--sp-3);">
      <p class="eyebrow">Your Inventory</p>
      <h2 style="font-size: 1.375rem;">RV Sites</h2>
    </div>
    <form id="addSiteForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-bottom: var(--sp-4);">
        <div class="field-float"><input id="siteName" required><label for="siteName">Site Name</label></div>
        <div class="field-float"><input id="siteType" required placeholder=" "><label for="siteType">Type (e.g. Full Hookup)</label></div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-bottom: var(--sp-4);">
        <div class="field-float"><input id="siteCapacity" type="number" min="1" required><label for="siteCapacity">Sleeps Up To</label></div>
        <div class="field-float"><input id="siteRate" type="number" min="1" step="0.01" required><label for="siteRate">Nightly Rate ($)</label></div>
      </div>
      <button type="submit" class="btn btn-ghost"><span>Add Site</span></button>
    </form>
    <div class="table-scroll">
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Type</th><th>Sleeps</th><th>Rate</th></tr></thead>
      <tbody id="sitesTableBody"></tbody>
    </table>
    </div>
    <div class="admin-empty" id="sitesEmpty" style="display:none;">No sites yet — add your first one above.</div>
  </div>

  <!-- Bookings Section -->
  <div class="admin-section glass" data-reveal>
    <div class="section-head" style="margin-bottom: 0;">
      <p class="eyebrow">Recent Activity</p>
      <h2 style="font-size: 1.375rem;">Bookings</h2>
    </div>
    <div class="table-scroll">
    <table class="admin-table">
      <thead><tr><th>Guest</th><th>Dates</th><th>Site</th><th>Status</th><th>Total</th></tr></thead>
      <tbody id="bookingsTableBody"></tbody>
    </table>
    </div>
    <div class="admin-empty" id="bookingsEmpty" style="display:none;">No bookings yet.</div>
  </div>
</div>

<script type="module" src="/src/js/park-owner-dashboard.js"></script>
</body>
</html>

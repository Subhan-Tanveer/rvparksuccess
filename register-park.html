<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register Your RVPark — RVPark Success</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/tokens.css">
<link rel="stylesheet" href="/src/css/components.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--sp-4); padding-top: calc(var(--sp-4) + 86px); }
  .login-card { width: 100%; max-width: 440px; padding: var(--sp-6) var(--sp-5); border-radius: var(--radius-lg); text-align: center; }
  .login-card h1 { font-size: 1.5rem; }
  .login-card .lede { font-size: 0.875rem; margin-top: var(--sp-2); }
  .login-error { display: none; margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); background: rgba(217,60,46,0.1); border: 1px solid rgba(217,60,46,0.4); color: #f0a89a; font-size: 0.875rem; }
  .login-error.is-visible { display: block; }
  .payment-banner { display: none; margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); background: rgba(46,155,84,0.12); border: 1px solid var(--border-amber); color: var(--amber-light); font-size: 0.875rem; }
  .payment-banner.is-visible { display: block; }
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="nav-pill-wrap">
  <div class="nav-pill">
    <a href="index.html" class="nav-brand"><span class="mark mark-logo"><img src="/images/logo/rvparksuccess-icon.png" alt="RVPark Success logo"></span><span class="name">RVPark Success</span></a>
  </div>
</div>

<div class="login-card glass-strong" id="gate" style="display:none;" data-reveal>
  <a href="index.html" class="nav-brand" style="justify-content:center; margin-bottom: var(--sp-4);"><span class="mark mark-logo"><img src="/images/logo/rvparksuccess-icon.png" alt="RVPark Success logo"></span></a>
  <p class="eyebrow">One Last Step</p>
  <h1>Register Your RVPark</h1>
  <p class="lede">Tell us your park's name and location — you can add sites, rates, and everything else from your dashboard next.</p>
  <div class="payment-banner" id="paymentBanner">Payment confirmed — welcome aboard!</div>

  <form id="registerForm" style="margin-top: var(--sp-4); text-align:left;">
    <div class="field-float"><input id="rpName" name="parkName" required><label for="rpName">Park Name</label></div>
    <div class="field-float"><input id="rpLocation" name="location" required placeholder=" "><label for="rpLocation">Location (City, State)</label></div>
    <button type="submit" class="btn btn-primary magnetic" style="width:100%; justify-content:center;" id="registerBtn"><span>Finish Setup</span></button>
  </form>

  <div class="login-error" id="registerError"></div>
</div>

<script type="module" src="/src/js/register-park.js"></script>
</body>
</html>
